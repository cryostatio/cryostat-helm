{{- if ( include "cryostat.core.service.tls" . | eq "true" ) }}
{{- $fullName := include "cryostat.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oauth2proxy-tls
  labels:
    {{- include "cryostat.labels" $ | nindent 4 }}
type: Opaque
immutable: true
data:
  {{- include "cryostat.selfSignedCertData" (dict "namespace" .Release.Namespace "secretName" (printf "%s-oauth2proxy-tls" .Release.Name) "commonName" $fullName) | nindent 2 }}
{{- end -}}
