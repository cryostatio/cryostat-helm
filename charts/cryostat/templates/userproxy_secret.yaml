{{- if empty .Values.authentication.userProxySecretName -}}
{{- $value := include "cryostat.userProxySecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-user-proxy
  labels:
    {{- include "cryostat.labels" $ | nindent 4 }}
type: Opaque
stringData:
  # Passed to the Cryostat container as CRYOSTAT_SECURITY_USER_PROXY_SECRET.
  USER_PROXY_SECRET: {{ $value | quote }}
  # The same value, rendered as the nginx directive that stamps it onto every forwarded
  # request. nginx cannot interpolate a file or an environment variable into a directive
  # value, so the shared secret has to reach it as configuration rather than as data. Both
  # keys are rendered from one variable, so the two ends cannot disagree.
  user-auth.conf: {{ printf "proxy_set_header X-Cryostat-User-Proxy-Auth %q;\n" $value | quote }}
{{- end -}}
