suite: test userproxy_secret.yaml
templates:
  - userproxy_secret.yaml

tests:
  - it: should create a user proxy secret if authentication.userProxySecretName is not set
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-user-proxy
      - equal:
          path: type
          value: Opaque
      - exists:
          path: stringData.USER_PROXY_SECRET
      - exists:
          path: stringData['user-auth.conf']
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: cryostat
            app.kubernetes.io/part-of: cryostat
            app.kubernetes.io/version: 4.3.0-dev
            helm.sh/chart: cryostat-2.3.0-dev

  # nginx cannot interpolate an environment variable or a file into a directive value, so the
  # shared secret has to be shipped twice: once raw for Cryostat's secretKeyRef, and once
  # already wrapped in the directive nginx will include. Both keys render from a single
  # variable, so the two ends cannot drift apart.
  - it: should render both keys from the same value
    asserts:
      - matchRegex:
          path: stringData['user-auth.conf']
          pattern: '^proxy_set_header X-Cryostat-User-Proxy-Auth "[a-zA-Z0-9]{32}";\n$'

  - it: should not create a user proxy secret if authentication.userProxySecretName is set
    set:
      authentication.userProxySecretName: "custom-user-proxy-secret"
    asserts:
      - hasDocuments:
          count: 0
