suite: test reports_deployment.yaml
templates:
  - reports_deployment.yaml

tests:
  - it: should verify general deployment settings when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should verify general deployment settings when enabled
    set:
      reports:
        replicas: 2
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cryostat-v4-reports
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: cryostat
            app.kubernetes.io/component: reports
            app.kubernetes.io/part-of: cryostat
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: cryostat
            app.kubernetes.io/part-of: cryostat
            app.kubernetes.io/component: reports
      - notExists:
          path: spec.template.spec.serviceAccountName
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: cryostat-2.3.0-dev
            app.kubernetes.io/name: cryostat
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "4.3.0-dev"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: reports
            app.kubernetes.io/part-of: cryostat

  - it: should validate all container settings including environment variables and security contexts
    set:
      reports:
        replicas: 1
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].image
          value: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.6"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].ports
          value:
            - containerPort: 4180
              name: http
              protocol: TCP
      - exists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].image
          value: "quay.io/cryostat/cryostat-reports:4.3.0-snapshot"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].env[?(@.name=='QUARKUS_HTTP_PORT')].value
          value: "10001"

  - it: should validate authproxy settings when deployed in OpenShift
    set:
      reports:
        replicas: 1
      authentication:
        openshift:
          enabled: true
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].image
          value: "quay.io/openshift/origin-oauth-proxy:4.22"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].ports
          value:
            - containerPort: 4180
              name: http
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP

  - it: should apply Kubernetes specific settings when configured
    set:
      reports:
        replicas: 1
      nodeSelector:
        disktype: ssd
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
      tolerations:
      - key: "key"
        operator: "Equal"
        value: "value"
        effect: "NoSchedule"
    asserts:
      - exists:
          path: spec.template.spec.nodeSelector
      - exists:
          path: spec.template.spec.affinity
      - exists:
          path: spec.template.spec.tolerations

  - it: should accept specific nodeSelector setting
    set:
      reports.replicas: 1
      reports.nodeSelector:
        diskType: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            diskType: ssd

  - it: should prefer specific nodeSelector over general
    set:
      reports.replicas: 1
      nodeSelector:
        disktype: hdd
      reports.nodeSelector:
        diskType: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            diskType: ssd

  - it: should accept specific tolerations setting
    set:
      reports.replicas: 1
      reports.tolerations:
        - key: "key1"
          operator: "Equal"
          value: "value1"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: "key1"
              operator: "Equal"
              value: "value1"
              effect: "NoSchedule"

  - it: should prefer specific tolerations over general
    set:
      reports.replicas: 1
      tolerations:
        - key: "key1"
          operator: "Equal"
          value: "value1"
          effect: "NoSchedule"
      reports.tolerations:
        - key: "key2"
          operator: "Equal"
          value: "value2"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: "key2"
              operator: "Equal"
              value: "value2"
              effect: "NoSchedule"

  - it: should accept specific affinity setting
    set:
      reports.replicas: 1
      reports.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                    - ssd

  - it: should prefer specific affinity over general
    set:
      reports.replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
      reports.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                    - ssd

  - it: should verify image pull policies for development snapshots
    set:
      reports:
        replicas: 1
        image:
          tag: "4.0.0-snapshot"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].imagePullPolicy
          value: Always

  - it: should verify image pull policies for release versions
    set:
      reports:
        replicas: 1
        image:
          tag: "4.3.0"
          pullPolicy: "IfNotPresent"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].imagePullPolicy
          value: "IfNotPresent"

  - it: should set default podAnnotations
    set:
      reports.replicas: 1
      podAnnotations:
        foo: bar
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            foo: bar

  - it: should set pod-specific podAnnotations
    set:
      reports.replicas: 1
      reports.podAnnotations:
        foo: bar
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            foo: bar

  - it: should set merge pod-specific and default podAnnotations
    set:
      reports.replicas: 1
      reports.podAnnotations:
        foo: bar
      podAnnotations:
        alice: bob
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            alice: bob
            foo: bar

  - it: should set extra env vars and env sources
    set:
      reports:
        replicas: 1
        config:
          extra:
            envVars:
            - name: FOO
              value: "bar"
            - name: ANOTHER_FOO
              valueFrom:
                configMapKeyRef:
                  name: myconfigmap
                  key: another_foo
                  optional: true
            - name: FOO_SECRET
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: foo_secret
                  optional: false
            envSources:
            - secretRef:
                name: sercret-special-config
                optional: false
            - configMapRef:
                name: cm-special-config
                optional: false
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].env[?(@.name=='FOO')].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].env[?(@.name=='ANOTHER_FOO')].valueFrom
          value:
            configMapKeyRef:
              name: "myconfigmap"
              key: "another_foo"
              optional: true
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].env[?(@.name=='FOO_SECRET')].valueFrom
          value:
            secretKeyRef:
              name: "mysecret"
              key: "foo_secret"
              optional: false
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].envFrom
          value:
          - secretRef:
              name: sercret-special-config
              optional: false
          - configMapRef:
              name: cm-special-config
              optional: false

  - it: should set extra env vars and env sources for oauth2-proxy container
    set:
      reports.replicas: 1
      oauth2Proxy.config.extra:
        envVars:
        - name: FOO
          value: "bar"
        - name: ANOTHER_FOO
          valueFrom:
            configMapKeyRef:
              name: myconfigmap
              key: another_foo
              optional: true
        - name: FOO_SECRET
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: foo_secret
              optional: false
        envSources:
        - secretRef:
            name: sercret-special-config
            optional: false
        - configMapRef:
            name: cm-special-config
            optional: false
        inPod:
          main:
            envVars:
            - name: ONLY_IN_MAIN
              value: "true"
            envSources:
            - secretRef:
                name: sercret-special-config-for-main
                optional: false
          reports:
            envVars:
            - name: ONLY_IN_REPORTS
              value: "true"
            envSources:
            - secretRef:
                name: sercret-special-config-for-reports
                optional: false
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='FOO')].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ANOTHER_FOO')].valueFrom
          value:
            configMapKeyRef:
              name: "myconfigmap"
              key: "another_foo"
              optional: true
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ONLY_IN_REPORTS')].value
          value: "true"
      - notExists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ONLY_IN_MAIN')].value
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='FOO_SECRET')].valueFrom
          value:
            secretKeyRef:
              name: "mysecret"
              key: "foo_secret"
              optional: false
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].envFrom
          value:
          - secretRef:
              name: sercret-special-config
              optional: false
          - configMapRef:
              name: cm-special-config
              optional: false
          - secretRef:
              name: sercret-special-config-for-reports
              optional: false

  - it: should set extra env vars and env sources for openshift-oauth container
    set:
      reports.replicas: 1
      authentication.openshift.enabled: true
      openshiftOauthProxy.config.extra:
        envVars:
        - name: FOO
          value: "bar"
        - name: ANOTHER_FOO
          valueFrom:
            configMapKeyRef:
              name: myconfigmap
              key: another_foo
              optional: true
        - name: FOO_SECRET
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: foo_secret
              optional: false
        envSources:
        - secretRef:
            name: sercret-special-config
            optional: false
        - configMapRef:
            name: cm-special-config
            optional: false
        inPod:
          main:
            envVars:
            - name: ONLY_IN_MAIN
              value: "true"
            envSources:
            - secretRef:
                name: sercret-special-config-for-main
                optional: false
          reports:
            envVars:
            - name: ONLY_IN_REPORTS
              value: "true"
            envSources:
            - secretRef:
                name: sercret-special-config-for-reports
                optional: false
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='FOO')].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ANOTHER_FOO')].valueFrom
          value:
            configMapKeyRef:
              name: "myconfigmap"
              key: "another_foo"
              optional: true
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ONLY_IN_REPORTS')].value
          value: "true"
      - notExists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='ONLY_IN_MAIN')].value
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].env[?(@.name=='FOO_SECRET')].valueFrom
          value:
            secretKeyRef:
              name: "mysecret"
              key: "foo_secret"
              optional: false
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].envFrom
          value:
          - secretRef:
              name: sercret-special-config
              optional: false
          - configMapRef:
              name: cm-special-config
              optional: false
          - secretRef:
              name: sercret-special-config-for-reports
              optional: false

  - it: should mount a default scratch emptyDir on the Report Generator container
    set:
      reports.replicas: 1
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='cryostat-reports-scratch')]
          value:
            name: cryostat-reports-scratch
            emptyDir: {}
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].volumeMounts[?(@.name=='cryostat-reports-scratch')]
          value:
            name: cryostat-reports-scratch
            mountPath: /tmp

  - it: should omit the Report Generator scratch volume when it is disabled
    set:
      reports.replicas: 1
      reports.scratch.emptyDir.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='cryostat-reports-scratch')]
      - notExists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].volumeMounts[?(@.name=='cryostat-reports-scratch')]

  - it: should back the Report Generator scratch volume with a generic ephemeral volume
    set:
      reports.replicas: 1
      reports.scratch.volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='cryostat-reports-scratch')]
          value:
            name: cryostat-reports-scratch
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

  - it: should not mount a scratch volume on the reports OAuth2 Proxy by default
    set:
      reports.replicas: 1
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='cryostat-reports-authproxy-scratch')]
      - notExists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].volumeMounts[?(@.name=='cryostat-reports-authproxy-scratch')]

  - it: should mount a default scratch volume on the reports OpenShift OAuth Proxy
    set:
      reports.replicas: 1
      authentication.openshift.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=='cryostat-reports-authproxy-scratch')]
          value:
            name: cryostat-reports-authproxy-scratch
            emptyDir: {}
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].volumeMounts[?(@.name=='cryostat-reports-authproxy-scratch')]
          value:
            name: cryostat-reports-authproxy-scratch
            mountPath: /tmp

  - it: should mount a scratch volume on the reports OAuth2 Proxy when enabled
    set:
      reports.replicas: 1
      oauth2Proxy.scratch.emptyDir.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].volumeMounts[?(@.name=='cryostat-reports-authproxy-scratch')]
          value:
            name: cryostat-reports-authproxy-scratch
            mountPath: /tmp

  - it: should add extra volumes and volume mounts for the Report Generator container
    set:
      reports.replicas: 1
      reports.config.extra.volumes:
        - name: reports-extra
          emptyDir: {}
      reports.config.extra.volumeMounts:
        - name: reports-extra
          mountPath: /var/cache/cryostat-reports
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=='reports-extra')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].volumeMounts[?(@.name=='reports-extra')]
          value:
            name: reports-extra
            mountPath: /var/cache/cryostat-reports

  - it: should add extra volumes and volume mounts for the reports auth proxy container
    set:
      reports.replicas: 1
      oauth2Proxy.config.extra.volumes:
        - name: reports-authproxy-extra
          emptyDir: {}
      oauth2Proxy.config.extra.volumeMounts:
        - name: reports-authproxy-extra
          mountPath: /var/cache/oauth2-proxy
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=='reports-authproxy-extra')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].volumeMounts[?(@.name=='reports-authproxy-extra')]
          value:
            name: reports-authproxy-extra
            mountPath: /var/cache/oauth2-proxy

  - it: should start every container in the Report Generator Pod with a read-only root filesystem
    set:
      reports.replicas: 1
      reports.securityContext.readOnlyRootFilesystem: true
      oauth2Proxy.securityContext.readOnlyRootFilesystem: true
      oauth2Proxy.scratch.emptyDir.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].securityContext.readOnlyRootFilesystem
          value: true
      - exists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports')].volumeMounts[?(@.mountPath=='/tmp')]
      - equal:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].securityContext.readOnlyRootFilesystem
          value: true
      - exists:
          path: spec.template.spec.containers[?(@.name=='cryostat-reports-authproxy')].volumeMounts[?(@.mountPath=='/tmp')]
