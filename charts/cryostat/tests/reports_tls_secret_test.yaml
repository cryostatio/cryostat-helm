suite: test reports_tls_secret.yaml
templates:
  - reports_tls_secret.yaml

tests:
  - it: should create a TLS cert secret if oauth2Proxy.tls.selfSigned.enabled is set
    set:
      oauth2Proxy:
        tls:
          selfSigned:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oauth2proxy-reports-tls
      - equal:
          path: type
          value: Opaque
      - equal:
          path: immutable
          value: true
      - exists:
          path: data.key
      - exists:
          path: data.cert
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: cryostat
            app.kubernetes.io/part-of: cryostat
            app.kubernetes.io/version: "5.0.0-dev"
            helm.sh/chart: cryostat-5.0.0-dev

  - it: should create a TLS cert secret if authentication.openshift.enabled is set
    set:
      authentication:
        openshift:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oauth2proxy-reports-tls
      - exists:
          path: data.key
      - exists:
          path: data.cert

  - it: should not create a TLS cert secret if neither trigger is set
    set:
      oauth2Proxy:
        tls:
          selfSigned:
            enabled: false
      authentication:
        openshift:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
